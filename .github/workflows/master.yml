name: master

# Every push to master (only fast-forwarded pull requests that passed pull-request.yml land here) repeats the cheap
# gates, publishes the container image to GHCR (tags: commit SHA and `latest`) and then waits at the `production`
# environment gate: the deployment is a decision, not a side effect of merging. A pending approval holds the
# concurrency group, so approve or reject it before the next push is expected to build.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Consecutive pushes queue instead of cancelling each other: an image build is never interrupted half-way.
concurrency:
  group: master
  cancel-in-progress: false

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - run: npm run lint
      - run: npm run check

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - run: npm test

  image:
    name: Container image
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Railway
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers on the environment gate this job. Railway then pulls the fresh `latest` digest from GHCR
    # and restarts the service (the project token lives only in the environment secrets).
    environment:
      name: production
      url: https://mindagora.ai
    steps:
      - name: Redeploy the Railway service from the image pushed above
        run: npx -y @railway/cli@latest redeploy --service 6779ba16-0906-490a-ae9c-b7602fc0702a --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
