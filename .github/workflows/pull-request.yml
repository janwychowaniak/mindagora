name: pull-request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - run: npm run lint
      - run: npm run check

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - run: npm run build

  e2e:
    name: E2E tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      # The same local stack as on a developer machine (the CLI is a devDependency, Docker is on the runner),
      # trimmed to what the app uses: database, auth, REST and the gateway.
      - name: Start Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Write .env.test from the running stack
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "OPENROUTER_X_TITLE=MindAgora"
            echo "E2E_USERNAME=e2e@mindagora.local"
            echo "E2E_PASSWORD=E2eTest-2026!"
            echo "E2E_OPENROUTER_KEY=$E2E_OPENROUTER_KEY"
          } > .env.test
        env:
          # Optional: without it the scenarios that talk to OpenRouter skip themselves.
          E2E_OPENROUTER_KEY: ${{ secrets.E2E_OPENROUTER_KEY }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  status-comment:
    name: PR status comment
    if: github.event_name == 'pull_request'
    needs: [unit, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- pull-request-status -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n✅ Lint, type check, unit tests, E2E tests and the production build passed for ${(context.payload.pull_request?.head?.sha ?? context.sha).slice(0, 7)}.\n\n[Run details](${runUrl})`;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
