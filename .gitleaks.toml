title = "MindAgora gitleaks config"

[extend]
useDefault = true                    # keep the FULL built-in ruleset; rules below only ADD coverage

[allowlist]
description = "false positives / paths not worth scanning"
paths = [
  '''\.gitleaks\.toml''',            # carries rule regexes itself
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.astro/''',
]
regexes = [
  # Public, constant demo tokens of every LOCAL Supabase instance (iss=supabase-demo).
  # They are not secrets; without this every doc mentioning local setup would trip the jwt rule.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0\.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU''',
  '''sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH''',
]

# --- ADD-ON rules: prefix-anchored, unique jw- ids, never override built-ins ---------
# The built-in generic-api-key is silenced by stopwords inside a secret's own value;
# prefix-anchored rules fire regardless. One per credential format actually used here.
[[rules]]
id = "jw-openrouter-key"
description = "OpenRouter API key (sk-or-v1-)"
regex = '''sk-or-v1-[0-9a-f]{64}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "jw-anthropic-key"
description = "Anthropic API key (missed outright by defaults: 'ant' stopword)"
regex = '''\bsk-ant-[A-Za-z0-9]{2,12}-[A-Za-z0-9_-]{80,120}\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "jw-supabase-secret-key"
description = "Supabase secret key (new format sb_secret_)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
